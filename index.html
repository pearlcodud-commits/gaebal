<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 마을 개발 대작전</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5fae46;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
canvas{display:block;touch-action:none;position:fixed;inset:0}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(30,45,70,.78);color:#fff;font-weight:900;font-size:18px;padding:5px 14px 5px 6px;border-radius:999px;border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.25);min-height:40px}
.pill .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#fff}
.bar{width:90px;height:12px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(#7ee36a,#3fb04a);width:100%;transition:width .3s}
.btns{display:flex;gap:8px;pointer-events:auto}
.rb{width:46px;height:46px;border-radius:14px;border:3px solid #fff;background:linear-gradient(#5aa9ff,#2f78e0);box-shadow:0 4px 0 #1d4f9c;font-size:22px;display:grid;place-items:center;cursor:pointer;color:#fff}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 #1d4f9c}
#quest{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.95);border:3px solid #ffb938;border-radius:18px;padding:8px 16px;font-weight:900;font-size:16px;color:#4a3410;box-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none;max-width:92vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.t{background:rgba(255,255,255,.96);border-radius:14px;padding:8px 16px;font-weight:900;font-size:16px;color:#333;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:tin .25s ease-out;max-width:88vw;text-align:center}
.t.warn{background:#fff1ee;color:#b23a1b;border:2px solid #ff8a65}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#modal.hidden{display:none}
.card{background:#fffaf0;border-radius:26px;border:5px solid #fff;box-shadow:0 8px 0 #d9b98a,0 18px 40px rgba(0,0,0,.35);width:min(560px,100%);max-height:94vh;overflow:auto;padding:20px 20px 18px;animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 10px;font-size:24px;text-align:center;color:#3b2a10}
.card p{font-size:17px;line-height:1.55;color:#3b3b3b;margin:8px 0;font-weight:700}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;color:#fff;font-weight:900;font-size:14px}
.opts{display:grid;gap:10px;margin-top:12px}
.ob{font:inherit;font-weight:900;font-size:18px;padding:14px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#ffffff,#eef3ff);box-shadow:0 4px 0 #b9c6e6;cursor:pointer;color:#22325a;text-align:left}
.ob:active{transform:translateY(3px);box-shadow:0 1px 0 #b9c6e6}
.ob.ok{background:linear-gradient(#a8f0a0,#5fd36a);box-shadow:0 4px 0 #2f9a3c;color:#0d3b12}
.ob.no{background:linear-gradient(#ffc2b8,#ff8a7a);box-shadow:0 4px 0 #c4483a;color:#5a130b}
.ob:disabled{cursor:default}
.gb{font:inherit;font-weight:900;font-size:19px;padding:12px 26px;border-radius:16px;border:3px solid #fff;background:linear-gradient(#7be05a,#3dae36);box-shadow:0 5px 0 #23802a;color:#fff;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gb:active{transform:translateY(3px);box-shadow:0 2px 0 #23802a}
.gb.blue{background:linear-gradient(#6cb6ff,#2f78e0);box-shadow:0 5px 0 #1d4f9c}
.gb.gray{background:linear-gradient(#c9c9c9,#9a9a9a);box-shadow:0 5px 0 #6d6d6d}
.gb.red{background:linear-gradient(#ff8a7a,#e04a3a);box-shadow:0 5px 0 #9c2a1d}
.gb:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#7a5a20;font-size:15px}
.qq{font-size:21px;font-weight:900;color:#222;margin:10px 0 4px;line-height:1.45}
.exp{background:#fff;border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:700;font-size:16px;line-height:1.5;border:2px dashed #ffcf6b}
.order{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;border:3px solid #f1e2c4}
.order .need{font-size:20px;font-weight:900}
.order .rw{font-weight:900;color:#2d8a2d;font-size:17px}
.big{font-size:64px;text-align:center;line-height:1.1}
.how{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center;font-weight:800;font-size:16px;color:#333;margin:12px 0}
.how b{font-size:28px;text-align:center}
.dex h3{margin:12px 0 6px;font-size:17px}
.dexrow{display:flex;flex-wrap:wrap;gap:8px}
.dx{background:#fff;border-radius:12px;padding:6px 10px;font-weight:900;border:2px solid #eee;font-size:15px}
.dx.off{color:#bbb;background:#f4f4f4}
@media (max-width:600px){.pill{font-size:14px;min-height:32px;padding:3px 10px 3px 4px;border-width:2px}.pill .ic{width:24px;height:24px;font-size:14px}.bar{width:56px}.rb{width:38px;height:38px;font-size:18px;border-radius:12px}.pills{gap:5px}#quest{font-size:14px}.card h2{font-size:21px}.qq{font-size:18px}.ob{font-size:16px;padding:11px}}
.imp{background:#fff4e8;border-left:6px solid #ff9d3c;padding:8px 12px;border-radius:10px}
.good{background:#eaffea;border-left:6px solid #3dbb4a;padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pills">
    <div class="pill"><span class="ic" style="background:#7ed957">💵</span><span id="hMoney">0</span></div>
    <div class="pill"><span class="ic" style="background:#ffe36b">⚡</span><span id="hEnergy">0/0</span></div>
    <div class="pill"><span class="ic" style="background:#b6f0a8">🌿</span><span class="bar"><i id="hNat"></i></span><span id="hNatN">100</span></div>
    <div class="pill"><span class="ic" style="background:#ffd29a">🏗️</span><span id="hProg">0/21</span></div>
  </div>
  <div class="btns">
    <div class="rb" id="bDex" title="개발 도감">📖</div>
    <div class="rb" id="bSnd" title="소리">🔊</div>
    <div class="rb" id="bSet" title="설정">⚙️</div>
  </div>
</div>
<div id="toast"></div>
<div id="quest">🎯 퀴즈 센터에 가 보세요!</div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<script>
"use strict";
// ================== 기본 설정 ==================
const N=30, HW=32, HH=16;
const G={GRASS:0,WATER:1,SAND:2,ROCK:3,SNOW:4,ROAD:5,RAIL:6,TUN:7};
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ZOOM=Math.max(.72,Math.min(1.45,Math.min(W,H)/600));}
resize();addEventListener('resize',resize);
const TS=Math.min(2,Math.max(1.25,DPR*ZOOM));
const TTS=Math.min(TS,1.5);
const S=(x,y,z=0)=>[(x-y)*HW,(x+y)*HH-z];
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function poly(g,pts,fill,stroke,lw){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}return'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function box(g,x,y,w,d,z,h,col,opt){opt=opt||{};const top=opt.top||shade(col,.18),L=opt.left||col,R=opt.right||shade(col,-.22);
  poly(g,[S(x,y+d,z),S(x+w,y+d,z),S(x+w,y+d,z+h),S(x,y+d,z+h)],L);
  poly(g,[S(x+w,y+d,z),S(x+w,y,z),S(x+w,y,z+h),S(x+w,y+d,z+h)],R);
  poly(g,[S(x,y,z+h),S(x+w,y,z+h),S(x+w,y+d,z+h),S(x,y+d,z+h)],top);}
function roofX(g,x,y,w,d,z,rh,col,gable){const o=.12,x0=x-o,x1=x+w+o,y0=y-o,y1=y+d+o,ym=y+d/2;
  poly(g,[S(x0,y0,z),S(x1,y0,z),S(x1,ym,z+rh),S(x0,ym,z+rh)],shade(col,-.3));
  poly(g,[S(x+w,y,z),S(x+w,y+d,z),S(x+w,ym,z+rh)],gable||'#f3e6cf');
  poly(g,[S(x0,y1,z),S(x1,y1,z),S(x1,ym,z+rh),S(x0,ym,z+rh)],col);
  g.strokeStyle=shade(col,-.4);g.lineWidth=1;g.beginPath();const a=S(x0,ym,z+rh),b=S(x1,ym,z+rh);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
function winL(g,x,yF,z,w,h,c){poly(g,[S(x,yF,z),S(x+w,yF,z),S(x+w,yF,z+h),S(x,yF,z+h)],c||'#9fdcff','#ffffff',1.2);}
function winR(g,xF,y,z,w,h,c){poly(g,[S(xF,y+w,z),S(xF,y,z),S(xF,y,z+h),S(xF,y+w,z+h)],c||'#86c8ec','#ffffff',1.2);}
function slab(g,x,y,w,d,col,h){box(g,x,y,w,d,0,h||2,col);}
function sign(g,x,y,z,text,bg,fg){const p=S(x,y,z);g.font='900 11px sans-serif';const tw=g.measureText(text).width+12;g.fillStyle='rgba(0,0,0,.25)';rr(g,p[0]-tw/2+1,p[1]-9+2,tw,17,6);g.fill();g.fillStyle=bg;rr(g,p[0]-tw/2,p[1]-9,tw,17,6);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();g.fillStyle=fg||'#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(text,p[0],p[1]+.5);}
function ellipse(g,x,y,rx,ry,c){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=c;g.fill();}

// ================== 스프라이트 캐시 ==================
function makeSprite(bx,by,bw,bh,fn,sc){sc=sc||TS;const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(bw*sc));c.height=Math.max(1,Math.ceil(bh*sc));const g=c.getContext('2d');g.scale(sc,sc);g.translate(-bx,-by);fn(g);return{c,bx,by,bw,bh};}
function drawTree(g,X,Y,v){
  ellipse(g,X,Y,13,6,'rgba(0,0,0,.18)');
  if(v<3){ // 활엽수
    g.fillStyle='#7a4f2a';g.fillRect(X-2.5,Y-12,5,12);
    const cols=[['#3f9e3a','#5cc04a','#8fe070'],['#358a3a','#4fae49','#7fd469'],['#4a9a2c','#6fbf3c','#a6e06a']][v];
    ellipse(g,X,Y-22,15,13,cols[0]);ellipse(g,X-6,Y-24,9,9,cols[1]);ellipse(g,X+5,Y-27,9,9,cols[1]);ellipse(g,X-2,Y-31,8,7,cols[2]);ellipse(g,X-5,Y-27,4,3.5,'rgba(255,255,255,.25)');
  }else{ // 침엽수 (snow = v>=5)
    g.fillStyle='#6b4423';g.fillRect(X-2,Y-8,4,8);
    const c1=v===5?'#2f6e4c':'#2d7a3e',c2=v===5?'#3d8a5f':'#3d9a4f';
    for(let i=0;i<3;i++){const yy=Y-8-i*10,w=13-i*3;poly(g,[[X-w,yy],[X+w,yy],[X,yy-16]],i%2?c2:c1);poly(g,[[X,yy],[X+w,yy],[X,yy-16]],'rgba(0,0,0,.12)');
      if(v===5)poly(g,[[X-w*.45,yy-9],[X+w*.45,yy-9],[X,yy-16]],'#f4f8ff');}
  }
}
const TREE_SPR=[];for(let v=0;v<6;v++)TREE_SPR.push(makeSprite(-18,-48,36,56,g=>drawTree(g,0,0,v)));
function drawPeak(g,v){const r=rnd(77+v*13),h=58+v*12;const L=[-HW-6,0],R=[HW+6,0],B=[0,HH+4],T=[(r()-.5)*10,-h];
  poly(g,[L,B,T],'#8d8170');poly(g,[B,R,T],'#6f6455');
  poly(g,[[T[0]-14,T[1]+22],[T[0],T[1]+16],[T[0]+15,T[1]+24],T],'#f4f6fb');poly(g,[[T[0],T[1]+16],[T[0]+15,T[1]+24],T],'#d5dceb');
  for(let i=0;i<5;i++){ellipse(g,-18+i*9,-4-r()*10,6,4,'#4f9a43');}}
const PEAK_SPR=[];for(let v=0;v<3;v++)PEAK_SPR.push(makeSprite(-HW-10,-100,2*HW+20,124,g=>drawPeak(g,v)));
// 아이템 스프라이트 (등에 쌓이는 것)
function drawItem(g,t){
  if(t==='money'){poly(g,[[-9,-2],[0,-6.5],[9,-2],[0,2.5]],'#7fe35f','#2f8c2a',1);poly(g,[[-9,-2],[0,2.5],[0,5],[-9,.5]],'#46b23a');poly(g,[[0,2.5],[9,-2],[9,.5],[0,5]],'#2f8c2a');ellipse(g,0,-2,3,1.6,'#3a9a34');}
  else if(t==='cabbage'){ellipse(g,0,-3,7,6,'#5fbf3c');ellipse(g,-2,-5,4,3.5,'#a6ec74');ellipse(g,2,-1,3,2,'#3d9a2a');}
  else if(t==='milk'){g.fillStyle='#f6f6f6';g.fillRect(-5,-9,10,11);g.fillStyle='#2f8fe8';g.fillRect(-5,-12,10,4);g.fillStyle='#2f8fe8';g.fillRect(-3,-5,6,3);g.strokeStyle='#bbb';g.lineWidth=.8;g.strokeRect(-5,-12,10,14);}
  else if(t==='box'){box(g,-.18,-.18,.36,.36,0,8,'#c98b4a');g.strokeStyle='#8a5a2a';g.lineWidth=1;const a=S(-.18,0,8),b=S(.18,0,8);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
  else if(t==='tv'){box(g,-.2,-.16,.4,.32,0,10,'#4a5566');const a=S(-.2,.16,1.5),b=S(.2,.16,1.5),c=S(.2,.16,8.5),d=S(-.2,.16,8.5);poly(g,[a,b,c,d],'#58c4ff');}
  else if(t==='trash'){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,1,8,3.5,0,0,7);g.fill();ellipse(g,0,-5,7,7,'#3d3d47');ellipse(g,-2,-7,2.5,2,'#6a6a78');g.fillStyle='#e8c23a';g.fillRect(-1,-13,3,3);ellipse(g,6,0,3,2,'#c0d0d8');}
}
const ITEM_SPR={};['money','cabbage','milk','box','tv','trash'].forEach(t=>ITEM_SPR[t]=makeSprite(-12,-16,24,24,g=>drawItem(g,t),Math.max(TS,2)));
const GOODS={cabbage:{n:'배추',ic:'🥬',v:20},milk:{n:'우유',ic:'🥛',v:30},box:{n:'생활용품',ic:'📦',v:60},tv:{n:'가전제품',ic:'📺',v:100}};

// ================== 지도 ==================
const tiles=new Uint8Array(N*N);
function baseMap(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t=G.GRASS;
  if(y>=27)t=G.WATER;else if(y>=24)t=G.SAND;else if(y===19||y===20)t=G.WATER;
  else if((x===21||x===22)&&y<=14)t=G.ROCK;else if(x>=23&&(y===13||y===14))t=G.ROCK;else if(x>=23&&y<=12)t=G.SNOW;
  tiles[y*N+x]=t;}}
const tget=(x,y)=>(x<0||y<0||x>=N||y>=N)?-1:tiles[y*N+x];
const ROAD_T=[];for(let x=1;x<=20;x++)ROAD_T.push([x,11]);for(let y=0;y<=18;y++)if(y!==11)ROAD_T.push([12,y]);
const RAIL_T=[];for(let x=0;x<N;x++)RAIL_T.push([x,18]);

// ================== 시설 데이터 ==================
const CAT={'여가':'#3a8ee6','이동':'#2fa84f','생산':'#c99a16','에너지':'#7e63d6','환경':'#16a39a'};
const PLOTS=[
 {id:'farm',name:'배추밭',ic:'🥬',cat:'생산',cost:100,fp:[8,2,3,3],out:[9,5],req:[],nat:-3,layer:'g',prod:{t:'cabbage',p:2.5,max:10},
  why:'먹을거리(배추)를 얻으려고 풀밭을 일구어 밭을 만들었어요.',imp:'들꽃과 풀이 자라던 땅이 사라졌어요.'},
 {id:'market',name:'시장',ic:'🛒',cat:'생산',cost:150,fp:[13,7,2,2],out:[14,9],req:[],nat:-2,
  why:'생활에 필요한 물건을 사고팔 수 있도록 시장을 만들었어요. 이제 생산품을 팔 수 있어요!',imp:'나무 몇 그루를 베어 냈어요.'},
 {id:'road',name:'도로',ic:'🛣️',cat:'이동',cost:250,fp:[10,10,2,1],req:['farm','market'],nat:-5,
  why:'쉽고 편리하게 이동하려고 도로를 만들었어요. 이동 속도가 빨라져요!',imp:'땅이 포장되어 빗물이 땅속으로 스며들기 어려워요.'},
 {id:'ranch',name:'목장',ic:'🐄',cat:'생산',cost:350,fp:[3,1,3,3],out:[4,4],req:['road'],nat:-4,layer:'g',prod:{t:'milk',p:3,max:10},
  why:'우유를 얻으려고 숲을 풀밭으로 바꾸어 목장을 만들었어요.',imp:'숲이 줄어들어 새들이 살 곳이 줄었어요.'},
 {id:'contract',name:'계약 사무소',ic:'📜',cat:'생산',cost:350,fp:[9,7,2,2],out:[10,9],req:['road'],nat:-2,

// ================== 세계 만들기 ==================
function isReserved(x,y){
  const inR=(r)=>x>=r[0]&&x<r[0]+r[2]&&y>=r[1]&&y<r[1]+r[3];
  if(inR(QUIZ_B.fp)||inR(BAG_B.fp))return true;
  if(x>=2&&x<=11&&y>=8&&y<=12)return true; // 시작 광장
  for(const p of PLOTS){if(p.out&&p.out[0]===x&&p.out[1]===y)return true;if(p.pad!==p.fp&&inR(p.pad)&&p.pad.length&&!(p.fp[0]===p.pad[0]&&p.fp[1]===p.pad[1]))return true;}
  return false;
}
function genWorld(){
  baseMap();applyTerrainBuilds();
  const r=rnd(1234);trees=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tget(x,y);
    if(t!==G.GRASS&&t!==G.SNOW&&t!==G.ROAD&&t!==G.RAIL)continue;
    if(isReserved(x,y))continue;
    const edge=(x<2||y<2||x>N-3);
    if(r()<(edge?.55:t===G.SNOW?.28:.3)){const ox=.3+r()*.4,oy=.3+r()*.4;
      const v=t===G.SNOW?5:(r()<.25?4:Math.floor(r()*3));trees.push(mkTree(x+ox,y+oy,v));}}
  peaks=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(tget(x,y)===G.ROCK)peaks.push({x:x+.5,y:y+.5,v:(x*7+y*3)%3,tx:x,ty:y});
  for(const id in st.built)clearForBuild(PL[id],true);
}
function mkTree(x,y,v){return{x,y,v,young:false};}
function applyTerrainBuilds(){
  if(st.built.road)ROAD_T.forEach(([x,y])=>{if(tget(x,y)===G.GRASS)tiles[y*N+x]=G.ROAD;});
  if(st.built.rail)RAIL_T.forEach(([x,y])=>{if(tget(x,y)===G.GRASS||tget(x,y)===G.ROAD)tiles[y*N+x]=G.RAIL;});
  if(st.built.tunnel){tiles[11*N+21]=G.TUN;tiles[11*N+22]=G.TUN;}
}
function clearForBuild(p,silent){
  const f=p.fp;let tiles2=[];
  if(p.id==='road')tiles2=ROAD_T;else if(p.id==='rail')tiles2=RAIL_T.concat([[6,16],[7,16],[8,16],[6,17],[7,17],[8,17]]);
  const inside=t=>{if(tiles2.length)return tiles2.some(([x,y])=>Math.floor(t.x)===x&&Math.floor(t.y)===y);return t.x>=f[0]&&t.x<f[0]+f[2]&&t.y>=f[1]&&t.y<f[1]+f[3];};
  const keep=[];for(const t of trees){if(inside(t)){if(!silent)for(let i=0;i<5;i++)parts.push({x:t.x,y:t.y,z:20,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,vz:30+Math.random()*30,life:.8,c:'#5cc04a'});}else keep.push(t);}
  trees=keep;
  if(p.id==='tunnel')peaks=peaks.filter(k=>!(k.ty===11&&(k.tx===21||k.tx===22)));
  if(p.id==='eco'&&!trees.some(t=>t.young)){const r=rnd(99);for(let i=0;i<9;i++){const x=f[0]+.35+(i%3)*1+r()*.3,y=f[1]+.35+Math.floor(i/3)*1+r()*.3;trees.push({x,y,v:r()<.3?4:Math.floor(r()*3),young:true});}}
}
function walkable(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(x<.15||y<.15||x>N-.15||y>N-.15)return false;const t=tget(tx,ty);
  if(t===G.WATER){if(st.built.bridge&&(tx===12||tx===13)&&(ty===19||ty===20))return true;return false;}
  if(t===G.ROCK)return false;return true;}

const TER_PAD=40;
function renderTerrain(){
  const bx=-N*HW,by=-TER_PAD,bw=2*N*HW,bh=2*N*HH+TER_PAD+40;
  const sp=makeSprite(bx,by,bw,bh,g=>{
    const r=rnd(55);
    // 섬 옆면
    for(let i=0;i<N;i++){poly(g,[S(N,i),S(N,i+1),[S(N,i+1)[0],S(N,i+1)[1]+26],[S(N,i)[0],S(N,i)[1]+26]],tget(N-1,i)===G.WATER?'#2d7fb8':'#8a5a32');
      poly(g,[S(i,N),S(i+1,N),[S(i+1,N)[0],S(i+1,N)[1]+26],[S(i,N)[0],S(i,N)[1]+26]],tget(i,N-1)===G.WATER?'#3b93cc':'#a06a3c');}
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tget(x,y),q=[S(x,y),S(x+1,y),S(x+1,y+1),S(x,y+1)];let c;
      const ch=(x+y)%2;
      if(t===G.GRASS)c=ch?'#8fd65f':'#86ce58';
      else if(t===G.WATER){c=y>=27?(y>=28?'#3aa0dc':'#4fb6ea'):'#4cb3e6';}
      else if(t===G.SAND)c=ch?'#f6e3a6':'#f0dc98';
      else if(t===G.ROCK)c='#8c9a6a';
      else if(t===G.SNOW)c=ch?'#f4f8fd':'#e9f1fa';
      else if(t===G.ROAD||t===G.TUN)c='#8a929c';
      else if(t===G.RAIL)c='#b89a74';
      poly(g,q,c);
      if(t===G.GRASS&&r()<.35){const p=S(x+.2+r()*.6,y+.2+r()*.6);g.fillStyle=r()<.5?'#a6e47a':'#6fbb46';g.fillRect(p[0],p[1],2,3);g.fillRect(p[0]+3,p[1]+1,2,2);
        if(r()<.15){g.fillStyle=['#fff','#ffe35a','#ff8fb0'][Math.floor(r()*3)];g.beginPath();g.arc(p[0]+6,p[1]-1,1.8,0,7);g.fill();}}
      if(t===G.WATER){ // 물가
        const land=(xx,yy)=>{const tt=tget(xx,yy);return tt!==-1&&tt!==G.WATER;};
        g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.55)';
        if(land(x,y-1)){const a=S(x,y),b=S(x+1,y);g.beginPath();g.moveTo(a[0],a[1]+1);g.lineTo(b[0],b[1]+1);g.stroke();}
        if(land(x-1,y)){const a=S(x,y),b=S(x,y+1);g.beginPath();g.moveTo(a[0],a[1]+1);g.lineTo(b[0],b[1]+1);g.stroke();}
      }
      if(t===G.ROAD||t===G.TUN){g.strokeStyle='#f6f2e0';g.lineWidth=1.5;g.setLineDash([5,5]);g.beginPath();
        const horiz=(y===11&&x!==12),a=horiz?S(x,y+.5):S(x+.5,y),b=horiz?S(x+1,y+.5):S(x+.5,y+1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();g.setLineDash([]);
        poly(g,q,null,'rgba(0,0,0,.08)');}
      if(t===G.RAIL){for(let k=0;k<4;k++){const a=S(x+k*.25+.08,y+.15),b=S(x+k*.25+.08,y+.85);g.strokeStyle='#6b4a2c';g.lineWidth=3;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
        g.strokeStyle='#5d6670';g.lineWidth=1.6;[.3,.7].forEach(o=>{const a=S(x,y+o),b=S(x+1,y+o);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();});}
    }
  },TTS);
  terrainC=sp;
}

let AC=null;function snd(type){if(!soundOn)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const tone=(f,d,st2,tp,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'sine';o.frequency.setValueAtTime(f,t+st2);g.gain.setValueAtTime(v||.12,t+st2);g.gain.exponentialRampToValueAtTime(.001,t+st2+d);o.connect(g);g.connect(AC.destination);o.start(t+st2);o.stop(t+st2+d+.02);};
  if(type==='coin')tone(1200+Math.random()*300,.08,0,'square',.04);
  else if(type==='pick')tone(700+Math.random()*200,.07,0,'triangle',.08);
  else if(type==='ok'){tone(660,.12,0,'triangle');tone(880,.12,.1,'triangle');tone(1320,.2,.2,'triangle');}
  else if(type==='no'){tone(220,.25,0,'sawtooth',.06);tone(170,.3,.12,'sawtooth',.06);}
  else if(type==='build'){tone(523,.15,0,'triangle');tone(659,.15,.12,'triangle');tone(784,.15,.24,'triangle');tone(1047,.35,.36,'triangle');}
  else if(type==='hammer')tone(160,.06,0,'square',.05);
}catch(e){}}

let padState={id:null,t:0,consumed:false},tick=0;
function curPad(){const px=player.x,py=player.y;
  if(inRect(px,py,[QUIZ_B.out[0],QUIZ_B.out[1],1,1],.15))return'quiz';
  if(st.bag<BAG_COST.length&&inRect(px,py,[BAG_B.out[0],BAG_B.out[1],1,1],.15))return'bag';
  if(st.built.market&&inRect(px,py,[...PL.market.out,1,1],.15))return'market';
  if(st.built.contract&&inRect(px,py,[...PL.contract.out,1,1],.15))return'contract';
  for(const p of PLOTS){if(!st.built[p.id]&&!building[p.id]&&plotVisible(p)&&inRect(px,py,p.pad,.05))return'plot:'+p.id;}
  return null;}
function payTo(cost,paid,id){const need=cost-paid;if(need<=0||st.money<=0)return 0;const step=Math.min(need,st.money,Math.max(10,Math.round(cost/40/10)*10));st.money-=step;return step;}
function update(dt){
  time+=dt;
  // 이동
  let ix=0,iy=0;if(keys.ArrowLeft||keys.a)ix--;if(keys.ArrowRight||keys.d)ix++;if(keys.ArrowUp||keys.w)iy--;if(keys.ArrowDown||keys.s)iy++;
  if(joy.on){const m=Math.hypot(joy.dx,joy.dy);if(m>8){ix=joy.dx/Math.max(m,45);iy=joy.dy/Math.max(m,45);}}
  const im=Math.hypot(ix,iy);if(im>1){ix/=im;iy/=im;}
  player.moving=im>.05;
  if(player.moving){const v=speed()*dt,X=ix*v,Y=iy*v;const dxw=(X/HW+Y/HH)/2,dyw=(Y/HH-X/HW)/2;
    if(walkable(player.x+dxw,player.y))player.x+=dxw;if(walkable(player.x,player.y+dyw))player.y+=dyw;
    if(Math.abs(ix)>.1)player.face=ix>0?1:-1;player.walk+=dt*12;}
  // 패드
  const pd=curPad();if(pd!==padState.id){padState={id:pd,t:0,consumed:false};}else padState.t+=dt;
  tick+=dt;const doTick=tick>=.06;if(doTick)tick=0;
  if(pd&&padState.t>.25){
    if(pd==='quiz'&&!padState.consumed){padState.consumed=true;openQuiz();}
    else if(pd==='contract'&&!padState.consumed){padState.consumed=true;openContract();}
    else if(pd==='market'&&doTick&&st.goods.length){const t=st.goods.pop();const v=GOODS[t].v;st.money+=v;flys.push({fx:player.x,fy:player.y,fz:40,tx:PL.market.out[0]+.5,ty:PL.market.out[1]-.5,tz:20,t:0,dur:.35,type:t});floatText(PL.market.out[0]+.5,PL.market.out[1]+.5,'+'+v,'#2d9a2d');snd('coin');if(!st.goods.length)save();}
    else if(pd==='bag'&&doTick&&st.money>0){const cost=BAG_COST[st.bag];const s=payTo(cost,st.bagPaid);if(s){st.bagPaid+=s;flys.push({fx:player.x,fy:player.y,fz:50,tx:BAG_B.out[0]+.5,ty:BAG_B.out[1]+.5,tz:0,t:0,dur:.3,type:'money'});snd('coin');
      if(st.bagPaid>=cost){st.bag++;st.bagPaid=0;snd('build');toast(`🎒 가방 업그레이드! 이제 생산품을 ${BAG_CAP[st.bag]}개까지 들 수 있어요`);save();}}}
    else if(pd.startsWith('plot:')&&doTick&&st.money>0){const p=PL[pd.slice(5)];const paid=st.paid[p.id]||0;const s=payTo(p.cost,paid);if(s){st.paid[p.id]=paid+s;const c=[p.pad[0]+p.pad[2]/2,p.pad[1]+p.pad[3]/2];flys.push({fx:player.x,fy:player.y,fz:50,tx:c[0],ty:c[1],tz:0,t:0,dur:.3,type:'money'});snd('coin');
      if(st.paid[p.id]>=p.cost){building[p.id]={t:0,dur:2.5+p.cost/900};clearForBuild(p,false);toast(`🏗️ ${p.name} 공사 시작!`);save();}}}
  }
  // 공사
  for(const id in building){const b=building[id];b.t+=dt;if(Math.floor(b.t*4)!==Math.floor((b.t-dt)*4))snd('hammer');if(b.t>=b.dur){delete building[id];finishBuild(PL[id]);}}
  // 생산
  const en=energy();
  for(const p of PLOTS){if(!st.built[p.id]||!p.prod)continue;const pr=p.prod;const pl=piles[p.id]||(piles[p.id]={n:0,acc:0});
    if(p.need&&!en.pw[p.id])continue;if(pl.n>=pr.max)continue;pl.acc+=dt*(pr.leisure?leisureMult():1);if(pl.acc>=pr.p){pl.acc-=pr.p;pl.n++;}}
  // 줍기
  if(doTick){for(const p of PLOTS){const pl=piles[p.id];if(!pl||pl.n<=0)continue;const c=center(p.out);if(Math.hypot(player.x-c[0],player.y-c[1])>.85)continue;
    if(p.prod.t==='money'){const k=Math.min(pl.n,3);pl.n-=k;st.money+=k*p.prod.v;for(let i=0;i<k;i++)flys.push({fx:c[0],fy:c[1],fz:6+pl.n*3,toP:true,t:-i*.03,dur:.3,type:'money'});snd('coin');}
    else{const cap=BAG_CAP[st.bag];if(st.goods.length>=cap){if(!player.fullMsg||time-player.fullMsg>3){player.fullMsg=time;toast('🎒 가방이 꽉 찼어요! 시장에서 팔거나 가방을 업그레이드해요',true);}}
      else{pl.n--;st.goods.push(p.prod.t);flys.push({fx:c[0],fy:c[1],fz:6,toP:true,t:0,dur:.28,type:p.prod.t});snd('pick');}}}}
  // 쓰레기
  if(st.nature<70){trashTimer-=dt;if(trashTimer<=0){trashTimer=st.built.recycle?18:9;if(trash.length<8)spawnTrash();}}
  if(st.built.recycle){natRegen+=dt;if(natRegen>25){natRegen=0;if(st.nature<100)st.nature=Math.min(100,st.nature+1);}}
  for(let i=trash.length-1;i>=0;i--){const t=trash[i];if(Math.hypot(player.x-t.x,player.y-t.y)<.6){trash.splice(i,1);st.nature=Math.min(100,st.nature+1);st.money+=10;floatText(t.x,t.y,'🌿+1 💵+10','#1d8a4a');snd('pick');save();}}
  if(st.nature<60&&!warned60){warned60=true;toast('😢 자연이 훼손되어 관광객이 줄고 있어요! 쓰레기를 줍거나 환경 시설을 지어요',true);}if(st.nature>=65)warned60=false;
  // NPC, 차량

  for(const c of cars){c.s+=dt*c.v;}
  // 파티클
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vz-=120*dt;p.z+=p.vz*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0&&p.z>-5);
  for(const f of flys)f.t+=dt;flys=flys.filter(f=>f.t<f.dur);for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3);
  for(const k in popAnim){popAnim[k]+=dt;if(popAnim[k]>.6)delete popAnim[k];}
  saveT+=dt;if(saveT>5){saveT=0;save();}
}

function spawnTrash(){for(let k=0;k<30;k++){const x=1+Math.random()*(N-2),y=13+Math.random()*12;if(!walkable(x,y)||tget(Math.floor(x),Math.floor(y))!==G.GRASS&&tget(Math.floor(x),Math.floor(y))!==G.SAND)continue;

  padDiamond([...QUIZ_B.out,1,1],'#7b5cff',false,'rgba(123,92,255,.25)');
  if(st.bag<BAG_COST.length)padDiamond([...BAG_B.out,1,1],'#e0457b',false,'rgba(224,69,123,.22)');
  if(st.built.market)padDiamond([...PL.market.out,1,1],'#ff4d4d',false,'rgba(255,77,77,.2)');
  if(st.built.contract)padDiamond([...PL.contract.out,1,1],'#2f5fb8',false,'rgba(47,95,184,.2)');
  for(const p of PLOTS)if(st.built[p.id]&&p.out)padDiamond([...p.out,1,1],'rgba(255,255,255,.7)',false,null);
  // 바닥층 건물
  const drawB=(id)=>{const sp=getSprite(id);const a=popAnim[id];if(a!=null){const p=PL[id];const c=S(p.fp[0]+p.fp[2]/2,p.fp[1]+p.fp[3]);const s=a<.35?.6+a/.35*.5:1.1-(a-.35)/.25*.1;ctx.save();ctx.translate(c[0],c[1]);ctx.scale(s,s);ctx.translate(-c[0],-c[1]);ctx.drawImage(sp.c,sp.bx,sp.by,sp.bw,sp.bh);ctx.restore();}else ctx.drawImage(sp.c,sp.bx,sp.by,sp.bw,sp.bh);};
  const inView=(p)=>{const c=S(p.fp[0]+p.fp[2]/2,p.fp[1]+p.fp[3]/2);return c[0]>vx0-150&&c[0]<vx1+150&&c[1]>vy0-100&&c[1]<vy1+150;};
  for(const p of PLOTS)if(st.built[p.id]&&p.layer==='g'&&DRAW[p.id]&&inView(p))drawB(p.id);
  // 바닥층 동적
  if(st.built.ski)drawSkiDyn();if(st.built.park){const c=S(15.5,13.5,8);for(let i=0;i<6;i++){const a=time*3+i;const h=(a%1);ctx.fillStyle='rgba(200,240,255,.8)';ctx.beginPath();ctx.arc(c[0]+Math.cos(i)*h*8,c[1]-Math.sin(h*Math.PI)*10,1.5,0,7);ctx.fill();}}
  // 정렬 객체
  const objs=[];const add=(k,fn)=>objs.push({k,fn});
  for(const t of trees){const p=S(t.x,t.y);if(p[0]<vx0||p[0]>vx1||p[1]<vy0||p[1]>vy1+40)continue;const s=TREE_SPR[t.v];add(t.x+t.y,()=>ctx.drawImage(s.c,p[0]+s.bx,p[1]+s.by,s.bw,s.bh));}
  for(const k of peaks){const p=S(k.x,k.y);if(p[0]<vx0-40||p[0]>vx1+40||p[1]<vy0||p[1]>vy1+60)continue;const s=PEAK_SPR[k.v];add(k.x+k.y+.2,()=>ctx.drawImage(s.c,p[0]+s.bx,p[1]+s.by,s.bw,s.bh));}
  for(const p of PLOTS){if(st.built[p.id]&&p.layer!=='g'&&DRAW[p.id]&&inView(p))add(p.fp[0]+p.fp[2]/2+p.fp[1]+p.fp[3]/2,()=>{drawB(p.id);dynB(p);});
    if(st.built[p.id]&&p.layer==='g'&&p.id==='wind')add(p.fp[0]+p.fp[1]+2,()=>dynB(p));
    if(building[p.id])add(p.fp[0]+p.fp[2]/2+p.fp[1]+p.fp[3]/2,()=>drawScaffold(p));
    if(st.built[p.id]&&p.out&&piles[p.id])add(p.out[0]+p.out[1]+.9,()=>drawPile(p,piles[p.id]));}
  add(QUIZ_B.fp[0]+QUIZ_B.fp[1]+2,()=>{const s=getSprite('quiz');ctx.drawImage(s.c,s.bx,s.by,s.bw,s.bh);});
  add(BAG_B.fp[0]+BAG_B.fp[1]+2,()=>{const s=getSprite('bag');ctx.drawImage(s.c,s.bx,s.by,s.bw,s.bh);});
  for(const t of trash){const p=S(t.x,t.y);const s=ITEM_SPR.trash;add(t.x+t.y,()=>{ctx.drawImage(s.c,p[0]+s.bx,p[1]+s.by-Math.abs(Math.sin(time*3+t.x))*2,s.bw,s.bh);});}
  for(const n of npcs){const p=S(n.x,n.y);if(p[0]<vx0||p[0]>vx1||p[1]<vy0||p[1]>vy1)continue;add(n.x+n.y,()=>{ctx.save();ctx.translate(p[0],p[1]);ctx.scale(.7,.7);drawPlayerAt(ctx,0,0,{moving:true,walk:time*8+n.ph,face:n.face,shirt:n.c,hair:'#3a2a1a'});ctx.restore();});}
  if(st.built.road)for(const c of cars){const L=40,s=((c.s%L)+L)%L;let x,y,dir;if(s<20){x=.6+s;y=11.3;dir=1;}else{x=20.6-(s-20);y=11.75;dir=-1;}add(x+y,()=>drawCar(x,y,dir,c.c));}
  if(st.built.rail){const L=46,s=(time*4.5)%L-6;for(let i=0;i<4;i++){const x=s-i*1.7;if(x<-2||x>N+2)continue;add(x+18.5+.3,()=>drawTrainCar(x,i===0));}}
  add(player.x+player.y,()=>{const p=S(player.x,player.y);drawStack(p[0],p[1],player.face,player.moving?Math.abs(Math.sin(player.walk))*2.5:0);drawPlayerAt(ctx,p[0],p[1],{moving:player.moving,walk:player.walk,face:player.face,bun:1});});
  objs.sort((a,b)=>a.k-b.k);for(const o of objs)o.fn();
  // 파티클
  for(const p of parts){const q=S(p.x,p.y,p.z);ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.c;ctx.fillRect(q[0]-2,q[1]-2,4,4);}ctx.globalAlpha=1;
  for(const f of flys){if(f.t<0)continue;const k=f.t/f.dur,e=k*k*(3-2*k);let tx=f.tx,ty=f.ty,tz=f.tz;if(f.toP){tx=player.x;ty=player.y;tz=60;}
    const a=S(f.fx,f.fy,f.fz),b=S(tx,ty,tz);const x=a[0]+(b[0]-a[0])*e,y=a[1]+(b[1]-a[1])*e-Math.sin(k*Math.PI)*40;const s=ITEM_SPR[f.type];ctx.drawImage(s.c,x+s.bx,y+s.by,s.bw,s.bh);}
  // 라벨
  for(const p of vis){const c=S(p.pad[0]+p.pad[2]/2,p.pad[1]+p.pad[3]/2);if(c[0]<vx0||c[0]>vx1||c[1]<vy0||c[1]>vy1)continue;
    if(building[p.id]){const b=building[p.id];labelBoard(c[0],c[1]-60,'🏗️','공사 중...',null,b.t/b.dur,CAT[p.cat]);continue;}
    const paid=st.paid[p.id]||0;const bounce=Math.sin(time*4)*2;labelBoard(c[0],c[1]-14+bounce,p.ic,p.name,'💵 '+fmt(paid)+' / '+fmt(p.cost),paid/p.cost,CAT[p.cat]);}
  {const c=S(QUIZ_B.out[0]+.5,QUIZ_B.out[1]+.5);labelBoard(c[0],c[1]-6,'❓','퀴즈 풀기',null,null,'#7b5cff');}
  if(st.bag<BAG_COST.length){const c=S(BAG_B.out[0]+.5,BAG_B.out[1]+.5);labelBoard(c[0],c[1]-6,'🎒','가방 '+BAG_CAP[st.bag]+'→'+BAG_CAP[st.bag+1]+'칸','💵 '+fmt(st.bagPaid)+' / '+fmt(BAG_COST[st.bag]),st.bagPaid/BAG_COST[st.bag],'#e0457b');}
  if(st.built.market){const c=S(PL.market.out[0]+.5,PL.market.out[1]+.5);labelBoard(c[0],c[1]-6,'🛒','팔기',null,null,'#ff4d4d');}
  if(st.built.contract){const c=S(PL.contract.out[0]+.5,PL.contract.out[1]+.5);labelBoard(c[0],c[1]-6,'📜','계약',null,null,'#2f5fb8');}
  const en=energy();for(const id of['factory','factory2'])if(st.built[id]&&!en.pw[id]){const c=S(PL[id].fp[0]+1.5,PL[id].fp[1]+1.5,70);labelBoard(c[0],c[1],'⚡','전기 부족!',null,null,'#e04a3a');}
  for(const f of floats){const p=S(f.x,f.y,f.z+f.t*40);ctx.globalAlpha=clamp(1.3-f.t,0,1);ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(f.txt,p[0],p[1]);ctx.fillStyle=f.col;ctx.fillText(f.txt,p[0],p[1]);}ctx.globalAlpha=1;
  // 길 안내 화살표
  const tg=target();if(tg&&tg.pos){const tp=S(tg.pos[0],tg.pos[1]);const pp=S(player.x,player.y);const dx=tp[0]-pp[0],dy=tp[1]-pp[1],d=Math.hypot(dx,dy);
    if(d>110){const ang=Math.atan2(dy,dx);const r=48+Math.sin(time*6)*4;const ax=pp[0]+Math.cos(ang)*r,ay=pp[1]-20+Math.sin(ang)*r*.6;ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-6,-12);ctx.lineTo(-2,0);ctx.lineTo(-6,12);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();}
    else{const by2=tp[1]-110+Math.sin(time*6)*6;ctx.fillStyle='#ffcf3a';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tp[0]-10,by2);ctx.lineTo(tp[0]+10,by2);ctx.lineTo(tp[0],by2+14);ctx.closePath();ctx.stroke();ctx.fill();}}
  // 조이스틱
  ctx.setTransform(DPR,0,0,DPR,0,0);if(joy.on){ctx.globalAlpha=.45;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,7);ctx.fill();ctx.globalAlpha=.9;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(joy.ox+joy.dx,joy.oy+joy.dy,24,0,7);ctx.fill();ctx.strokeStyle='#2f78e0';ctx.lineWidth=4;ctx.stroke();ctx.globalAlpha=1;}
}
function drawScaffold(p){const[x,y,w,d]=p.fp;const b=building[p.id];const h=Math.min(40,10+b.t/b.dur*40);box(ctx,x+.15,y+.15,w-.3,d-.3,0,h*.6,'#d7b98a');
  ctx.strokeStyle='#e8a33a';ctx.lineWidth=2;for(let i=0;i<=w;i++){const a=S(x+.15+i*(w-.3)/w,y+d-.15,0),c=S(x+.15+i*(w-.3)/w,y+d-.15,h);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...c);ctx.stroke();}
  for(let j=1;j<=3;j++){const a=S(x+.15,y+d-.15,h*j/3),c=S(x+w-.15,y+d-.15,h*j/3),e=S(x+w-.15,y+.15,h*j/3);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...c);ctx.lineTo(...e);ctx.stroke();}
  const hp=S(x+w/2,y+d/2,h+18+Math.abs(Math.sin(time*8))*6);ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('⛑️',hp[0],hp[1]);}
function dynB(p){if(p.id==='wind'){[[p.fp[0]+.5,p.fp[1]+.45],[p.fp[0]+1.5,p.fp[1]+1.45]].forEach(([x,y],i)=>{const b=S(x,y,2),tp=S(x,y,80);poly(ctx,[[b[0]-3,b[1]],[b[0]+3,b[1]],[tp[0]+1.2,tp[1]],[tp[0]-1.2,tp[1]]],'#f4f4f4','#ccc',1);
    ellipse(ctx,tp[0],tp[1],4,4,'#e8e8e8');const a0=time*3+i;for(let k=0;k<3;k++){const a=a0+k*Math.PI*2/3;ctx.save();ctx.translate(tp[0],tp[1]);ctx.rotate(a);poly(ctx,[[0,-2],[34,-1],[34,1.5],[0,3]],'#ffffff','#bbb',1);ctx.restore();}});}
  if((p.id==='factory'||p.id==='factory2')&&energy().pw[p.id]){const H=p.id==='factory2'?30:26,top=H+(p.id==='factory2'?50:44);const c=S(p.fp[0]+.5,p.fp[1]+.55,top);for(let i=0;i<4;i++){const k=(time*.5+i/4)%1;ctx.globalAlpha=(1-k)*.55;ellipse(ctx,c[0]+k*18,c[1]-k*40,5+k*10,4+k*8,st.nature<50?'#777':'#ddd');}ctx.globalAlpha=1;}
  if(p.id==='dam'){for(let i=0;i<3;i++){const yy=18.55+.5+i*.85;for(let k=0;k<3;k++){const ph=(time*2+k/3+i*.3)%1;const a=S(26.98+ph*.3,yy+.2,16-ph*20);ctx.fillStyle='rgba(220,245,255,.85)';ctx.fillRect(a[0]-3,a[1],6,4);}}
    const c=S(27.6,20,0);for(let k=0;k<4;k++){ctx.globalAlpha=.6;ellipse(ctx,c[0]+Math.sin(time*3+k)*6,c[1]-k*3,10-k,4,'#ffffff');}ctx.globalAlpha=1;}}
function drawSkiDyn(){const[x,y,w,d]=PL.ski.fp;ctx.strokeStyle='#333';ctx.lineWidth=1;const b=S(x+w-.6,y+d-.6,36),t=S(x+w-.6,y+d-.6-3*1.3,36);ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(...t);ctx.stroke();
  for(let i=0;i<5;i++){const k=(time*.15+i/5)%1;const px=b[0]+(t[0]-b[0])*k,py=b[1]+(t[1]-b[1])*k;ctx.fillStyle=['#e04a3a','#3a8ee6'][i%2];ctx.fillRect(px-3,py+1,6,7);}
  for(let i=0;i<4;i++){const k=(time*.12+i/4)%1;const sx=x+.7+i*.7+Math.sin(k*12+i)*.35,sy=y+.4+k*(d-1.6);const q=S(sx,sy,4);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(q[0]-4,q[1],8,2);ctx.fillStyle=['#ff6f91','#7e63d6','#ffb21f','#2fbf8a'][i];ctx.fillRect(q[0]-2.5,q[1]-9,5,7);ellipse(ctx,q[0],q[1]-11,2.5,2.5,'#ffe0c4');ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(q[0]-5,q[1]+1);ctx.lineTo(q[0]+5,q[1]-1);ctx.stroke();}}
function drawCar(x,y,dir,c){const w=.7,d=.38;box(ctx,x-w/2,y-d/2,w,d,1,7,c);box(ctx,x-w/4,y-d/2+.02,w/2,d-.04,8,5,'#cfefff',{right:'#a8d8f0'});ellipse(ctx,...S(x-w/3,y+d/2,1),2.5,2.5,'#222');ellipse(ctx,...S(x+w/3,y+d/2,1),2.5,2.5,'#222');}
function drawTrainCar(x,head){const y=18.5,w=1.55,d=.55;box(ctx,x-w/2,y-d/2,w,d,3,15,'#ffffff',{right:'#d9dde3',top:'#eef2f6'});
  poly(ctx,[S(x-w/2,y+d/2,9),S(x+w/2,y+d/2,9),S(x+w/2,y+d/2,13),S(x-w/2,y+d/2,13)],'#2f78e0');
  for(let i=0;i<4;i++)winL(ctx,x-w/2+.1+i*.36,y+d/2,10,.24,4.5,'#1d3a6a');
  if(head){poly(ctx,[S(x+w/2,y-d/2,3),S(x+w/2,y+d/2,3),S(x+w/2+.35,y+d/2-.1,3),S(x+w/2+.35,y-d/2+.1,3)],'#2f78e0');poly(ctx,[S(x+w/2,y-d/2,18),S(x+w/2,y+d/2,18),S(x+w/2+.35,y,6)],'#ffffff');}}

// ================== 목표 안내 ==================
function target(){const vis=PLOTS.filter(p=>!st.built[p.id]&&!building[p.id]&&plotVisible(p)).sort((a,b)=>(a.cost-(st.paid[a.id]||0))-(b.cost-(st.paid[b.id]||0)));
  if(!vis.length){if(Object.keys(building).length)return{text:'🏗️ 공사가 끝나기를 기다려요!'};if(st.nature<70&&trash.length)return{pos:[trash[0].x,trash[0].y],text:'🗑️ 쓰레기를 주워 자연을 지켜요!'};return{text:'🎉 마을 완성! 쓰레기를 주우며 자연을 지켜요'};}
  const p=vis[0],need=p.cost-(st.paid[p.id]||0);const pc=[p.pad[0]+p.pad[2]/2,p.pad[1]+p.pad[3]/2];
  if(st.money>=need)return{pos:pc,text:`🏗️ ${p.ic} ${p.name} 점선 칸으로 가서 돈을 내려놓아요!`};
  if(st.goods.length>=BAG_CAP[st.bag]&&st.built.market)return{pos:center(PL.market.out),text:'🛒 가방이 꽉 찼어요! 시장에서 팔아요'};
  let best=null,bv=0;for(const q of PLOTS){const pl=piles[q.id];if(!pl||!st.built[q.id])continue;const v=pl.n*(q.prod.t==='money'?q.prod.v:GOODS[q.prod.t].v);if(v>bv&&(q.prod.t==='money'||st.goods.length<BAG_CAP[st.bag]-2)){bv=v;best=q;}}
  if(best&&bv>=120)return{pos:center(best.out),text:`${best.prod.t==='money'?'💵 돈을':'📦 생산품을'} 모으러 가요! (목표 💵${fmt(need)})`};
  if(st.goods.length>=4&&st.built.market)return{pos:center(PL.market.out),text:'🛒 생산품을 시장에서 팔아요'};
  return{pos:center(QUIZ_B.out),text:`❓ 퀴즈를 맞혀 돈을 벌어요! (다음 목표: ${p.ic} ${p.name} 💵${fmt(need)})`};}

// HUD
let hudT=0;function hud(){const en=energy();$('hMoney').textContent=fmt(st.money);$('hEnergy').textContent=en.need+'/'+en.tot;$('hEnergy').style.color=en.need>en.tot?'#ff9a8a':'#fff';
  $('hNat').style.width=st.nature+'%';$('hNat').style.background=st.nature>=60?'linear-gradient(#7ee36a,#3fb04a)':st.nature>=40?'linear-gradient(#ffd96a,#f0a52b)':'linear-gradient(#ff9a8a,#e04a3a)';$('hNatN').textContent=Math.round(st.nature);
  $('hProg').textContent=Object.keys(st.built).length+'/'+PLOTS.length;const t=target();$('quest').textContent=t?t.text:'';}

// ================== 루프 ==================
let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  try{if(!paused)update(dt);else time+=dt;render();hudT+=dt;if(hudT>.15){hudT=0;hud();}}catch(e){console.error(e);}
  requestAnimationFrame(loop);}
// 시작
(function init(){const sv=load();if(sv&&sv.st){st=Object.assign(freshState(),sv.st);if(typeof sv.px==='number'){player.x=sv.px;player.y=sv.py;}trash=(sv.trash||[]).map(([x,y])=>({x,y}));
    for(const id in st.built)if(!PL[id])delete st.built[id];}
  genWorld();renderTerrain();
  if(!walkable(player.x,player.y)){player.x=7.5;player.y=10.5;}
  if(st.built.road)cars=[{s:0,v:2.2,c:'#ff4d4d'},{s:9,v:1.8,c:'#3a8ee6'},{s:20,v:2,c:'#ffd23a'}];
  for(const p of PLOTS)if(st.built[p.id]&&p.prod)piles[p.id]={n:0,acc:0};
  refreshNPC();const P=S(player.x,player.y);cam.x=P[0];cam.y=P[1]-40;hud();
  intro(!!(sv&&sv.st&&(Object.keys(sv.st.built||{}).length||sv.st.money>0)));
  requestAnimationFrame(loop);})();
// 테스트용 훅
window.__T={st:()=>st,player,PL,update,finishBuild,building,piles,closeModal,openQuiz,openContract,setPaused:v=>paused=v};
</script>
